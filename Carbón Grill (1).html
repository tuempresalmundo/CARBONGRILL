<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carbón Grill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&amp;family=Barlow:wght@400;500;600&amp;family=Spline+Sans+Mono:wght@400;500&amp;display=swap">
<style id="page-style">
:root{
  /* Layout: black rounded top bar, icon-tile category scroller, white product cards on a warm paper ground, floating black bottom nav. Admin panel reuses the same tokens as a light ledger. */
  --bg:#f6f4ee;--surface:#ffffff;--raised:#faf8f2;--line:#e2ddd0;--line-soft:#ece8dc;--bar:#d7d0bd;
  --ink:#0e0e0e;--fg:#14120e;--muted:#6a655a;
  --accent:#c9a13b;--accent-text:#85601a;--accent-ink:#17120a;
  --gold:linear-gradient(135deg,#f1d57f 0%,#cfa73f 55%,#a87c1f 100%);
  --good:#2f7a4a;--bad:#b5481f;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 8px 22px rgba(40,30,8,.07);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}

/* top bar + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--ink);color:#fff;border-radius:0 0 26px 26px}
.top-in{max-width:1072px;margin:0 auto;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:8px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{text-decoration:none;color:#fff;justify-self:center;max-width:100%;background:#1b1b1b;border-radius:18px;padding:6px 22px;font:800 italic 1.55rem/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-logo{background:none;padding:0;border-radius:0;overflow:visible;display:grid;place-items:center}
.brand-logo img{height:54px;width:auto;max-width:100%;display:block}
.top-btn{position:relative;width:44px;height:44px;border-radius:16px;border:0;background:#222;color:#fff;display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:1.3rem}
.top-sp{width:44px;height:44px}
.badge-n{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--gold);color:var(--accent-ink);font:700 .78rem/22px var(--body);text-align:center}
.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-radius:32px;background:linear-gradient(180deg,#26221a,#0c0b08);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.nav a{position:relative;display:grid;justify-items:center;gap:2px;padding:9px 6px;border-radius:24px;color:#e9e3d2;text-decoration:none;font:600 .82rem var(--body)}
.nav a[aria-current="page"]{background:var(--gold);color:var(--accent-ink)}
.nav .badge-n{top:0;right:calc(50% - 30px)}

/* layout */
.wrap{max-width:1072px;margin:0 auto;padding-top:24px;padding-bottom:130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:760px}
.panel{padding-top:clamp(28px,6vw,64px);padding-bottom:160px}
.eyebrow{font:700 .78rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);margin:0 0 8px}
.title{font-size:clamp(2rem,6vw,3rem)}
.h-sm{font-size:clamp(1.6rem,4vw,2.2rem)}
.h-md{font-size:1.5rem}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:8px 0 12px}
.sec-head h2{font-size:1.6rem}
.sec-head .count{color:var(--muted);font-weight:600;font-size:.92rem}
.tagline{color:var(--muted);margin-bottom:14px}
.empty{color:var(--muted);padding:28px 0}


/* order mode hero — parrilla al carbón */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:clamp(22px,4vw,34px);margin-bottom:22px;
  background:
    radial-gradient(125% 95% at 20% 120%,rgba(255,146,38,.5) 0%,rgba(222,74,12,.28) 32%,rgba(180,50,10,0) 64%),
    radial-gradient(80% 70% at 88% -14%,rgba(241,213,127,.2),rgba(241,213,127,0) 60%),
    linear-gradient(165deg,#191308 0%,#0b0a07 46%,#1d1206 100%);
  box-shadow:inset 0 0 0 1px rgba(255,186,92,.16),0 16px 38px rgba(25,12,0,.22)}
.hero::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,214,150,.09) 0 2px,transparent 2px 22px);
  -webkit-mask-image:linear-gradient(to top,#000 0,rgba(0,0,0,.3) 46%,transparent 74%);
  mask-image:linear-gradient(to top,#000 0,rgba(0,0,0,.3) 46%,transparent 74%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
  background:
    radial-gradient(3px 3px at 14% 78%,rgba(255,196,104,.95),transparent 64%),
    radial-gradient(2px 2px at 31% 60%,rgba(255,150,60,.8),transparent 64%),
    radial-gradient(2.5px 2.5px at 47% 86%,rgba(255,214,140,.75),transparent 64%),
    radial-gradient(2px 2px at 62% 54%,rgba(255,138,46,.7),transparent 64%),
    radial-gradient(3px 3px at 77% 80%,rgba(255,186,96,.8),transparent 64%),
    radial-gradient(2px 2px at 90% 62%,rgba(255,160,70,.65),transparent 64%);
  animation:embers 7s ease-in-out infinite alternate}
@keyframes embers{from{transform:translateY(7px);opacity:.5}to{transform:translateY(-9px);opacity:1}}
.hero>*{position:relative;z-index:1}
.hero>.hero-grill{z-index:0;position:absolute;right:-30px;top:-26px;color:rgba(255,178,80,.16);line-height:0}
.hero-eyebrow{display:flex;align-items:center;gap:8px;font:700 .76rem/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:#f3c76a;margin-bottom:12px}
.hero-eyebrow svg{color:#ff9d3c;flex:none}
.hero h2{font:800 clamp(1.9rem,6vw,2.8rem)/1.05 var(--display);letter-spacing:-.01em;text-shadow:0 2px 20px rgba(255,120,20,.28)}
.hero p{color:#e8dcc2;margin:8px 0 18px;max-width:46ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,190,100,.2);max-width:520px}
.mode{display:grid;justify-items:center;gap:6px;padding:14px 8px;border-radius:20px;border:0;background:transparent;color:#fff;font:700 .98rem var(--body);cursor:pointer}
.mode-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.mode[aria-checked="true"]{background:linear-gradient(135deg,#ffd37c 0%,#e8912c 58%,#c2641a 100%);color:#1a0d02;box-shadow:0 8px 20px rgba(255,120,20,.28)}
.mode[aria-checked="true"] .mode-ic{background:rgba(26,13,2,.16)}
.dark-card{background:linear-gradient(165deg,#191308,#0b0a07);border-radius:30px;padding:8px}
.dark-card .modes{max-width:none;border:0}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.logo-prev{height:48px;width:auto;max-width:100%;background:var(--ink);border-radius:10px;padding:6px 12px}

/* carrusel tipo selección de jugador */
.cf-wrap{position:relative;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.cf{display:flex;align-items:stretch;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding-block:12px 20px;padding-inline:calc(50% - var(--iw)/2)}
.cf::-webkit-scrollbar{display:none}
.cf>*{--d:1;flex:none;width:var(--iw);scroll-snap-align:center;transform-origin:50% 60%;
  transform:scale(calc(1 - .18*var(--d)));
  filter:blur(calc(var(--d)*2.6px)) saturate(calc(1 - .4*var(--d)));
  opacity:calc(1 - .45*var(--d));
  transition:transform .16s linear,filter .16s linear,opacity .16s linear}
.cf>*:focus-within{--d:0;filter:none;opacity:1}
.cf-cards{--iw:min(72vw,262px)}
.cf-cats{--iw:146px}
.cf-cards>.card.is-active{box-shadow:0 0 0 2.5px var(--accent),0 18px 38px rgba(60,35,0,.22)}
.cf-arrow{display:grid;place-items:center;position:absolute;top:calc(50% - 20px);width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:var(--ink);color:#fff;font:400 1.5rem/1 var(--body);cursor:pointer;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.3);padding:0 0 3px}
.cf-arrow.prev{left:4px}
.cf-arrow.next{right:4px}
.cf-arrow:active{transform:scale(.92)}
@media (min-width:900px){
  .cf-arrow{width:46px;height:46px;top:calc(50% - 23px);font-size:1.7rem}
  .cf-arrow.prev{left:0}.cf-arrow.next{right:0}
}
@media (prefers-reduced-motion:reduce){
  .hero::after{animation:none}
  .cf>*{transition:none}
}

/* category tiles */
.tile{display:grid;justify-items:center;gap:8px;padding:16px 16px 14px;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);position:relative}
.tile span{font:700 .98rem/1.1 var(--display);text-align:center}
.tile[aria-pressed="true"]{background:var(--gold)}
.tile[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:8px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(14,14,14,.55)}
.tile[aria-pressed="true"] span{margin-bottom:6px}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:16px}
.card{position:relative;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);min-width:0}
.card-link{display:grid;gap:8px;padding:12px;text-decoration:none;color:inherit;height:100%;align-content:start}
.pimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:var(--ink);display:block}
.pimg-ph{display:grid;place-items:center;color:var(--accent);background:radial-gradient(circle at 30% 20%,#2a2518,#0e0e0e 70%)}
.pill{justify-self:start;margin-top:6px;background:#f6ecce;color:var(--accent-text);border-radius:999px;padding:4px 12px;font:700 .9rem var(--num);font-variant-numeric:tabular-nums}
.pill.off{background:#f5dccf;color:var(--bad);font-family:var(--body);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.card h3{font-size:1.25rem}
.cdesc{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.more{font:700 .88rem var(--body)}
.card.is-off .pimg{filter:grayscale(1);opacity:.6}
.heart{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:19px;border:0;background:rgba(14,14,14,.78);color:#fff;display:grid;place-items:center;cursor:pointer}
.heart[aria-pressed="true"]{color:#f1d57f}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.foot-l{display:grid;gap:12px;min-width:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
.social{display:flex;flex-wrap:wrap;gap:10px}
.sbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;color:#fff;text-decoration:none;font:700 .88rem var(--body)}
.sbtn.ig{background:linear-gradient(135deg,#f9ce34 0%,#ee2a7b 55%,#6228d7 100%)}
.sbtn.wa{background:#1fa855}
.sbtn svg{flex:none}

/* product page */
.pd{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:860px){.pd{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px}}
.pd .pimg{border-radius:26px}
.pd-info{display:grid;gap:18px;align-content:start;min-width:0}
.pd h1{font-size:clamp(2rem,6vw,3rem)}
.pd .pill{font-size:1.15rem;margin:0}
.pd-desc{color:var(--muted);font-size:1.02rem;max-width:56ch}
.group{display:grid;gap:10px}
.group h2{font-size:1.25rem}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer}
.top-row:has(input:checked){border-color:var(--accent);background:#fbf5e2}
.top-row input{width:20px;height:20px;accent-color:#a87c1f;flex:none}
.top-row .l{display:flex;align-items:center;gap:12px;min-width:0}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);justify-self:start}
.step button{width:44px;height:44px;border:0;background:none;font-size:1.3rem;cursor:pointer;border-radius:50%}
.step output{min-width:34px;text-align:center;font:700 1.1rem var(--num)}

/* cart */
.sp{height:16px}
.cartform{gap:14px;margin-top:8px}
.lines{display:grid;gap:12px;margin:16px 0 20px}
.line{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:8px}
.line-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.line-top strong{font:700 1.2rem var(--display)}
.line small{color:var(--muted);display:block}
.line-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.line .step button{width:38px;height:38px}
.totals{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px;border-top:1px solid var(--line);font:700 1.4rem var(--display)}
.totals .num{font-size:1.3rem}

/* forms + buttons (shared) */
.field{display:grid;gap:6px;min-width:0}
.field.wide{grid-column:1/-1}
.lbl{font:600 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-block;background:var(--gold);color:var(--accent-ink);border:0;border-radius:14px;padding:11px 20px;font:700 .95rem var(--body);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.5;cursor:default}
.btn.big{padding:15px 22px;font-size:1.05rem;width:100%}
.btn.ghost{background:none;color:var(--fg);border:1.5px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.btn.small{padding:6px 12px;font-size:.82rem;border-radius:10px}
.inline{display:inline-flex;gap:6px}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.3)}

/* admin panel */
.lock{max-width:440px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,28px);display:grid;gap:16px}
.lock-ic{width:54px;height:54px;border-radius:50%;background:var(--gold);color:var(--accent-ink);display:grid;place-items:center}
.lock h2{font-size:1.6rem}
.catgroup{margin-bottom:24px;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:4px 16px 12px}
.cathead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 0 8px}
.cathead .l{display:flex;align-items:center;gap:10px;min-width:0;color:var(--accent-text)}
.cathead h3{font-size:1.3rem;color:var(--fg)}
.catgroup .prow:first-of-type{border-top:0}
.panel-top{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.tabs{display:flex;flex-wrap:wrap;gap:4px 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 0;margin-bottom:-1px;font:700 1rem var(--body);cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.note{color:var(--muted);padding:14px 16px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;background:var(--surface)}
.note.warn{color:var(--bad);border-color:var(--bad)}
.block{margin-bottom:36px;display:grid;gap:16px}
.stack{display:grid;gap:28px}
.row-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:8px}
.form-grid{align-items:end;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 18px}
.check{display:flex;align-items:center;gap:10px}
.check input{width:18px;height:18px;accent-color:#a87c1f}
.prow{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px 16px;align-items:start}
.pthumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--raised)}
.ph{display:grid;place-items:center;font:700 1.5rem var(--display);color:var(--muted);border:1.5px dashed var(--line)}
.ptitle{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.tag{font:700 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:1px 8px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.fig{display:grid;gap:2px;min-width:0}
.fig .v{font:500 .95rem var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.editor{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
.editor-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.photo-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.photo-row img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:8px;align-items:center}
.tops-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tops-tools select{width:auto;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:22px 28px;padding-block:22px;border-block:1px solid var(--line)}
.kpi{display:grid;gap:4px;min-width:0}
.k-l{font:600 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-v{font:500 1.55rem/1.15 var(--num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k-s{color:var(--muted);font-size:.85rem}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.tbl th{text-align:left;font:600 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl .r{text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:11px var(--num)}
.chart .bar-rev{fill:var(--bar)}
.chart .bar-prof{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:.85rem;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px}
.sw-rev{background:var(--bar)}
.sw-prof{background:var(--accent)}
.month{display:grid;gap:6px;max-width:260px;margin-bottom:24px}
.badge{font:600 .68rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:2px solid var(--accent);display:flex;flex-wrap:wrap;gap:10px 20px;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-text{min-width:0}
.bar-acts{display:flex;gap:10px}
@media (max-width:640px){
  .prow{grid-template-columns:56px minmax(0,1fr)}
  .acts{grid-column:1/-1;justify-content:flex-start}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:minmax(0,1fr) 100px auto}
}

/* ---------- coverflow: carrusel con el centro destacado ---------- */
function coverflow(cls,items,initial,onCenter){
  var sc=el('div',{class:'cf '+cls});
  items.forEach(function(n){sc.append(n);});
  var wrap=el('div',{class:'cf-wrap '+cls+'-wrap'},sc);
  function paint(){
    var r=sc.getBoundingClientRect();
    if(!r.width)return null;
    var cx=r.left+r.width/2,half=r.width/2,best=null,bd=1e9;
    for(var i=0;i<sc.children.length;i++){
      var ch=sc.children[i],b=ch.getBoundingClientRect(),d=Math.abs(b.left+b.width/2-cx);
      ch.style.setProperty('--d',Math.min(1,d/half).toFixed(3));
      if(d<bd){bd=d;best=ch;}
    }
    for(var j=0;j<sc.children.length;j++)sc.children[j].classList.toggle('is-active',sc.children[j]===best);
    return best;
  }
  function center(node,smooth){
    if(!node)return;
    var r=sc.getBoundingClientRect(),b=node.getBoundingClientRect();
    if(!r.width)return;
    var dx=(b.left+b.width/2)-(r.left+r.width/2);
    if(Math.abs(dx)<1){paint();return;}
    if(sc.scrollBy)sc.scrollBy({left:dx,behavior:smooth?'smooth':'auto'});
    else sc.scrollLeft+=dx;
    if(!smooth)paint();
  }
  var t=null;
  sc.addEventListener('scroll',function(){
    paint();
    if(onCenter){
      clearTimeout(t);
      t=setTimeout(function(){var b=paint();if(b&&b.dataset.key)onCenter(b.dataset.key);},140);
    }
  },{passive:true});
  function step(dir){
    var n=sc.children.length;if(!n)return;
    var cur=0,r=sc.getBoundingClientRect(),cx=r.left+r.width/2,bd=1e9;
    for(var i=0;i<n;i++){
      var b=sc.children[i].getBoundingClientRect(),d=Math.abs(b.left+b.width/2-cx);
      if(d<bd){bd=d;cur=i;}
    }
    center(sc.children[(cur+dir+n)%n],true);
  }
  if(items.length>1){
    wrap.append(
      el('button',{class:'cf-arrow prev',type:'button','aria-label':'Ver el anterior',text:'‹',onclick:function(){step(-1);}}),
      el('button',{class:'cf-arrow next',type:'button','aria-label':'Ver el siguiente',text:'›',onclick:function(){step(1);}}));
  }
  requestAnimationFrame(function(){
    if(!sc.isConnected)return;
    if(initial)center(initial,false);
    paint();
  });
  if(window.ResizeObserver){
    var first=true;
    new ResizeObserver(function(){
      if(first){first=false;if(initial)center(initial,false);}
      paint();
    }).observe(sc);
  }
  wrap.center=center;wrap.paint=paint;
  return wrap;
}

/* ---------- publish (rebuilds this same page with the new catalog) ---------- */
function buildDoc(json){
  var styles=[].slice.call(document.querySelectorAll('head style'));
  var reset=styles.filter(function(s){return s.id!=='page-style'&&/safe-area-inset/.test(s.textContent)&&/\[hidden\]/.test(s.textContent);})[0];
  if(!reset)throw new Error('no-reset');
  var link=document.getElementById('font-link');
  var css=document.getElementById('page-style').textContent;
  var js=document.getElementById('app-script').textContent;
  var safe=json.replace(/</g,'\\u003c').replace(new RegExp(String.fromCharCode(8232),'g'),'\\u2028').replace(new RegExp(String.fromCharCode(8233),'g'),'\\u2029');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset.textContent+'</style></head><body>'
    +'<title>'+TITLE+'</title><meta name="claude:viewport-fit-sides" content="cover">'+link.outerHTML
    +'<style id="page-style">'+css+'</style><div id="app"></div>'
    +'<script type="application/json" id="catalog-data">'+safe+'<\/script>'
    +'<script id="app-script">'+js+'<\/script></body></html>';
}
function ensureDraft(){
  if(S.draft)return;
  S.draft=JSON.parse(JSON.stringify(published));
  S.draft.products.forEach(function(p){if(!p.toppings)p.toppings=[];});
}
function costOf(p){return p.cost!==undefined?(Number(p.cost)||0):((S.costs[p.id]&&S.costs[p.id].cost)||0);}
function isDirty(){
  if(!S.draft)return false;
  if(canon(S.draft)!==publishedCanon)return true;
  return S.draft.products.some(function(p){return p.cost!==undefined&&(Number(p.cost)||0)!==((S.costs[p.id]&&S.costs[p.id].cost)||0);});
}
async function publishAll(){
  if(S.busy)return;
  if(!S.artifact||!S.db){S.msg='Publicar no está disponible en esta vista.';updateBanner();return;}
  if(!S.costsReady){S.msg='Todavía se están cargando los costos. Intenta en unos segundos.';updateBanner();return;}
  S.busy=true;S.msg='';updateBanner();
  try{
    var d=S.draft;
    for(var i=0;i<d.products.length;i++){
      var p=d.products[i];
      if(p.cost===undefined)continue;
      var c=Math.max(0,Number(p.cost)||0);
      var prev=S.costs[p.id]&&S.costs[p.id].cost;
      if(prev!==c)await S.db.doc('costs/'+p.id).set({cost:c});
    }
    var keep={};d.products.forEach(function(p){keep[p.id]=1;});
    var ids=Object.keys(S.costs);
    for(var j=0;j<ids.length;j++){if(!keep[ids[j]])await S.db.doc('costs/'+ids[j]).delete();}
    await S.artifact.publish(buildDoc(canon(d)));
    S.busy=false;updateBanner();
  }catch(e){
    S.busy=false;
    S.msg=(e&&e.code==='conflict')?'Otra persona publicó al mismo tiempo. La página se recargará con su versión.':'No se pudo publicar la carta. Intenta de nuevo.';
    updateBanner();
  }
}

/* ---------- data (costs, sales, expenses) ---------- */
function startDb(){
  var ctimer=setTimeout(function(){if(!S.cfgReady){S.cfgReady=true;S.cfgError='No se pudo cargar el acceso. Revisa tu conexión.';if(S.view==='panel')render();}},10000);
  S.db.collection('config').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});
    var def=!snap.metadata||snap.metadata.fromCache===false;
    S.cfg=m.admin||null;
    if(def){clearTimeout(ctimer);S.cfgError='';S.cfgReady=true;}
    if(S.cfg&&S.cfg.hash&&sesGet()===fingerprint(S.cfg))S.unlocked=true;
    if(S.view==='panel'&&!S.unlocked&&!S.lockDirty&&!S.lockBusy)render();
  },function(e){
    clearTimeout(ctimer);S.cfgReady=true;
    S.cfgError='No se pudo leer el acceso ('+((e&&e.code)||'error')+').';
    if(S.view==='panel')render();
  });
  var timer=setTimeout(function(){if(!S.costsReady){S.dbError='Todavía no se pueden cargar los datos contables. Revisa tu conexión.';if(S.view==='panel')render();}},10000);
  S.db.collection('costs').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});
    S.costs=m;
    var def=!snap.metadata||snap.metadata.fromCache===false;
    if(def){clearTimeout(timer);S.dbError='';}
    if(def&&!S.costsReady){S.costsReady=true;if(S.view==='panel')render();}

  },function(e){S.dbError='No se pudieron leer los costos ('+((e&&e.code)||'error')+').';if(S.view==='panel')render();});

}
function subscribeMonth(){
  S.unsubs.forEach(function(u){u();});S.unsubs=[];
  var from=addMonth(S.month,-1)+'-01',to=addMonth(S.month,1)+'-01';
  var err=function(e){S.dbError='No se pudo leer la contabilidad ('+((e&&e.code)||'error')+').';if(S.view==='panel')render();};
  S.unsubs.push(S.db.collection('sales').where('date','>=',from).where('date','<',to).limit(1000).onSnapshot(function(s){
    S.sales=s.docs.map(function(d){var o=d.data();o.id=d.id;return o;});refresh();
  },err));
  S.unsubs.push(S.db.collection('expenses').where('date','>=',from).where('date','<',to).limit(1000).onSnapshot(function(s){
    S.expenses=s.docs.map(function(d){var o=d.data();o.id=d.id;return o;});refresh();
  },err));
}

function sesGet(){try{return sessionStorage.getItem('carta-panel-ok')||'';}catch(e){return '';}}
function sesSet(v){try{if(v)sessionStorage.setItem('carta-panel-ok',v);else sessionStorage.removeItem('carta-panel-ok');}catch(e){}}
function fingerprint(c){return String((c&&c.hash)||'').slice(0,16);}
function hasCrypto(){return !!(window.crypto&&crypto.subtle&&crypto.subtle.digest&&crypto.getRandomValues&&window.TextEncoder);}
function hex(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=a[i].toString(16).padStart(2,'0');return s;}
function randHex(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return hex(a.buffer);}

function dayChart(rows){
  var p=S.month.split('-').map(Number);var days=new Date(p[0],p[1],0).getDate();
  var rev=[],prof=[];for(var i=0;i<days;i++){rev.push(0);prof.push(0);}
  rows.forEach(function(r){var d=parseInt(String(r.date).slice(8,10),10)-1;if(d>=0&&d<days){rev[d]+=r.qty*r.price;prof[d]+=r.qty*(r.price-r.cost);}});
  var max=niceMax(Math.max.apply(null,rev.concat(prof)));
  var W=720,H=230,L=52,R=8,T=12,B=26,pw=W-L-R,ph=H-T-B,gw=pw/days;
  var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'Ventas y ganancia bruta por día','class':'chart'});
  [0,0.5,1].forEach(function(f){
    var yy=T+ph-ph*f;
    svg.append(sv('line',{x1:L,x2:W-R,y1:yy,y2:yy,'class':'grid'}));
    var t=sv('text',{x:L-6,y:yy+4,'class':'axis','text-anchor':'end'});t.textContent=compact(max*f);svg.append(t);
  });
  for(var i2=0;i2<days;i2++){
    var x=L+i2*gw,bw=Math.max(2,gw*0.62),bx=x+(gw-bw)/2;
    if(rev[i2]>0){
      var h=ph*rev[i2]/max;var r=sv('rect',{x:bx,y:T+ph-h,width:bw,height:h,'class':'bar-rev'});
      var ti=sv('title',{});ti.textContent='Día '+(i2+1)+': ventas '+money(rev[i2])+', ganancia '+money(prof[i2]);r.append(ti);svg.append(r);
    }
    if(prof[i2]>0){var h2=ph*prof[i2]/max;svg.append(sv('rect',{x:bx+bw*0.25,y:T+ph-h2,width:bw*0.5,height:h2,'class':'bar-prof'}));}
    if(i2===0||(i2+1)%5===0){var lt=sv('text',{x:x+gw/2,y:H-8,'class':'axis','text-anchor':'middle'});lt.textContent=String(i2+1);svg.append(lt);}
  }
  return svg;
}

/* ---------- boot ---------- */
window.addEventListener('hashchange',function(){
  var r=parseRoute();S.view=r.v;S.pid=r.id||null;S.confirm=null;
  if(S.view!=='product')S.sel=null;
  render();window.scrollTo(0,0);
});
normalizeCart();
render();
(async function(){
  var cl=window.claude;
  if(cl&&cl.use){
    try{var user=await cl.use('user');S.isAdmin=user?await user.canEdit():false;}catch(e){S.isAdmin=false;}
    if(S.isAdmin){
      try{S.artifact=await cl.use('artifact');}catch(e){}
      try{S.assets=await cl.use('assets');}catch(e){}
      try{S.db=await cl.use('db');}catch(e){}
      if(S.db)startDb();
    }
  }
  S.checked=true;
  if(S.view==='panel')render();
})();
})();
</script>

</body></html>
